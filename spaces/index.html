<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Spaces</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f7f9f8;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .container { width: 100%; max-width: 440px; }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    @media (max-width: 500px) {
      .card { padding: 32px 24px; }
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e293b;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
      text-align: left;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      color: #1e293b;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="email"]:focus {
      border-color: #BF3143;
      box-shadow: 0 0 0 3px rgba(191, 49, 67, 0.14);
    }

    input[type="email"]::placeholder { color: #94a3b8; }

    button {
      width: 100%;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: #BF3143;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.02s;
      margin-bottom: 12px;
    }

    button:hover { opacity: 0.92; }
    button:active { opacity: 0.84; transform: translateY(0.5px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    button.secondary {
      background: #f0f4f3;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      margin-bottom: 0;
    }

    button.secondary:hover { background: #e8f4ed; opacity: 1; }

    .helper-text {
      font-size: 14px;
      color: #64748b;
      margin-top: -4px;
    }

    .status {
      display: none;
      font-size: 14px;
      color: #475569;
      background: rgba(71, 85, 105, 0.08);
      padding: 12px 16px;
      border-radius: 10px;
      margin: 16px 0 0 0;
      text-align: left;
      word-break: break-word;
    }

    .status.active { display: block; }

    .error {
      color: #BF3143;
      background: rgba(191, 49, 67, 0.08);
    }

    .form-container { display: block; }
    .form-container.hidden { display: none; }

    .success-message { display: none; }
    .success-message.active { display: block; }

    .success-text {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .success-subtext {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .fineprint {
      margin-top: 18px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }

    a { color: #64748b; text-decoration: underline; text-underline-offset: 3px; }

    /* Custom confirm modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .modal-message {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 0;
    }
    .modal-actions .btn-cancel {
      background: #f0f4f3;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    .modal-actions .btn-cancel:hover { background: #e8f4ed; opacity: 1; }
    .modal-actions .btn-delete {
      background: #BF3143;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <div class="modal-title">Delete space?</div>
      <div class="modal-message">This will remove the saved space from your account.</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-delete" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Tiny Spaces</h1>
      <p class="subtitle">Save and recover your Tiny spaces with email.</p>

      <div class="status" id="statusBox"></div>

      <!-- Sign-in form -->
      <div class="form-container" id="formContainer">
        <form id="signInForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>

          <button type="submit" id="submitButton">Send magic link</button>
          <p class="helper-text">No password. No spam.</p>
        </form>

        <p class="fineprint">
          Saving to email helps you recover this space later.
          Sharing still uses sync codes.
        </p>
      </div>

      <!-- Success state -->
<div class="success-message" id="successMessage">

  <p class="success-text">You're signed in.</p>
  <p class="success-subtext">
    Your saved Tiny spaces.
  </p>

  <!-- Saved spaces -->
  <div id="spacesSection" style="text-align:left; margin-top: 18px;">
    <div style="display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom: 12px;">
      <div style="font-weight:700; color:#1e293b;">Saved spaces</div>
      <button
        class="secondary"
        id="addSpaceBtn"
        type="button"
        style="width:auto; padding:10px 14px; border-radius:999px;"
      >
        + Add space
      </button>
    </div>

    <!-- Add space form (hidden by default) -->
    <div id="addSpaceForm" style="display:none; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:12px; background:#f7f9f8;">
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:600; color:#1e293b; margin-bottom:6px;">App</label>
        <select id="appSelect" style="width:100%; padding:8px 12px; font-size:14px; border:1px solid #e2e8f0; border-radius:8px; background:#fff;">
          <option value="meals">Tiny Meals</option>
          <option value="do">Tiny Do</option>
          <option value="body">Tiny Body</option>
          <option value="nudge">Tiny Nudge</option>
        </select>
      </div>
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:600; color:#1e293b; margin-bottom:6px;">Sync Code</label>
        <input type="text" id="syncCodeInput" placeholder="Enter your sync code" style="width:100%; padding:8px 12px; font-size:14px; border:1px solid #e2e8f0; border-radius:8px;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:600; color:#1e293b; margin-bottom:6px;">Label (optional)</label>
        <input type="text" id="labelInput" placeholder="e.g., Family Meals" style="width:100%; padding:8px 12px; font-size:14px; border:1px solid #e2e8f0; border-radius:8px;">
      </div>
      <div style="display:flex; gap:8px;">
        <button id="saveSpaceBtn" type="button" style="flex:1; background:#BF3143; color:#fff; padding:10px; border-radius:999px; border:none; font-weight:600; cursor:pointer;">
          Save
        </button>
        <button id="cancelSpaceBtn" type="button" class="secondary" style="flex:1; padding:10px; border-radius:999px;">
          Cancel
        </button>
      </div>
    </div>

    <div id="spacesList" style="display:grid; gap:10px;"></div>
  </div>

  <!-- Sign out -->
  <button
    class="secondary"
    id="signOutButton"
    type="button"
    style="margin-top: 16px;"
  >
    Sign out
  </button>

</div>

    </div>
  </div>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    // =========================
    // Firebase init (umbrella project: tinywins-account)
    // =========================
    const firebaseConfig = {
      apiKey: "AIzaSyBF4Dm-N-0rKQfVSnmPamxnZDO-jWlYXZQ",
      authDomain: "tinywins-account.firebaseapp.com",
      projectId: "tinywins-account",
      appId: "1:500103077791:web:3402c4b9bb0aab89bf27aa"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();


    // IMPORTANT: this must match your deployed URL (and be in Firebase Auth authorized domains)
    const ACTION_URL = "https://tinywins.space/spaces/";
    const actionCodeSettings = {
      url: ACTION_URL,
      handleCodeInApp: true
    };

    // LocalStorage key (namespaced)
    const EMAIL_KEY = "tiny_spaces_emailForSignIn";

    // =========================
    // UI elements
    // =========================
    const form = document.getElementById("signInForm");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submitButton");
    const formContainer = document.getElementById("formContainer");
    const successMessage = document.getElementById("successMessage");
    const signOutButton = document.getElementById("signOutButton");
    const statusBox = document.getElementById("statusBox");
    const spacesListEl = document.getElementById("spacesList");

    // Add space form elements
    const addSpaceBtn = document.getElementById("addSpaceBtn");
    const addSpaceForm = document.getElementById("addSpaceForm");
    const appSelect = document.getElementById("appSelect");
    const syncCodeInput = document.getElementById("syncCodeInput");
    const labelInput = document.getElementById("labelInput");
    const saveSpaceBtn = document.getElementById("saveSpaceBtn");
    const cancelSpaceBtn = document.getElementById("cancelSpaceBtn");


    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.classList.add("active");
      statusBox.classList.toggle("error", isError);
    }

    function hideStatus() {
      statusBox.classList.remove("active");
      statusBox.classList.remove("error");
      statusBox.textContent = "";
    }

    function showSignedInState() {
      formContainer.classList.add("hidden");
      successMessage.classList.add("active");
      hideStatus();
    }

    function showSignInForm() {
      formContainer.classList.remove("hidden");
      successMessage.classList.remove("active");
      submitButton.disabled = false;
      submitButton.textContent = "Send magic link";
      emailInput.value = "";
      hideStatus();
    }

    // =========================
    // 1) Send magic link
    // =========================
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideStatus();

      const email = (emailInput.value || "").trim();
      if (!email) {
        showStatus("Please enter a valid email address.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Sending…";

      try {
        await auth.sendSignInLinkToEmail(email, actionCodeSettings);
        window.localStorage.setItem(EMAIL_KEY, email);

        submitButton.disabled = false;
        submitButton.textContent = "Send magic link";
        showStatus("Magic link sent. Check your email.");
      } catch (err) {
        console.error(err);
        submitButton.disabled = false;
        submitButton.textContent = "Send magic link";

        // Common: auth/unauthorized-domain
        const errorMessage = err?.code ? `${err.message} (${err.code})` : (err?.message || "Could not send link. Please try again.");
        showStatus(errorMessage, true);
      }
    });

    // =========================
    // 2) Complete sign-in if this page is opened via email link
    // =========================
    (async function completeSignInIfLink() {
      try {
        if (!auth.isSignInWithEmailLink(window.location.href)) return;

        let email = window.localStorage.getItem(EMAIL_KEY);
        if (!email) {
          email = window.prompt("Please confirm your email to sign in:");
        }
        if (!email) {
          showStatus("Email is required to complete sign-in.", true);
          return;
        }

        await auth.signInWithEmailLink(email, window.location.href);
        window.localStorage.removeItem(EMAIL_KEY);

        // Clean URL (prevents re-processing the link on refresh)
        window.history.replaceState({}, document.title, "/spaces/");

        showSignedInState();
      } catch (err) {
        console.error(err);
        showStatus(err?.message || "Sign-in failed. Please try again.", true);
      }
    })();

    // =========================
    // 3) Show signed-in state if already logged in (same browser)
    // =========================
auth.onAuthStateChanged(async (user) => {
  if (user) {
    showSignedInState();

    // Load spaces
    try {
      const spaces = await listSpacesForUser(user.uid);
      renderSpaces(spaces);
    } catch (e) {
      console.error("Failed to load spaces:", e);
      showStatus(e?.message || "Couldn't load saved spaces.", true);
    }

    // Wire up Add Space form (only once)
    if (addSpaceBtn && !addSpaceBtn.dataset.bound) {
      addSpaceBtn.dataset.bound = "true";

      // Show form when clicking "+ Add space"
      addSpaceBtn.addEventListener("click", () => {
        addSpaceForm.style.display = "block";
        addSpaceBtn.style.display = "none";
      });

      // Cancel button
      cancelSpaceBtn.addEventListener("click", () => {
        addSpaceForm.style.display = "none";
        addSpaceBtn.style.display = "block";
        // Reset form
        syncCodeInput.value = "";
        labelInput.value = "";
      });

      // Save button
      saveSpaceBtn.addEventListener("click", async () => {
        const appId = appSelect.value;
        const syncCode = syncCodeInput.value.trim();
        const label = labelInput.value.trim();

        if (!syncCode) {
          showStatus("Please enter a sync code.", true);
          return;
        }

        try {
          saveSpaceBtn.disabled = true;
          await addSpace(user.uid, appId, syncCode, label);
          const spaces = await listSpacesForUser(user.uid);
          renderSpaces(spaces);

          // Reset and hide form
          addSpaceForm.style.display = "none";
          addSpaceBtn.style.display = "block";
          syncCodeInput.value = "";
          labelInput.value = "";
          hideStatus();
        } catch (e) {
          console.error("Failed to add space:", e);
          showStatus(e?.message || "Couldn't save space.", true);
        } finally {
          saveSpaceBtn.disabled = false;
        }
      });
    }

  } else {
    if (!auth.isSignInWithEmailLink(window.location.href)) {
      showSignInForm();
    }
  }
});


function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderSpaces(spaces) {
  if (!spacesListEl) return;

  if (!spaces || spaces.length === 0) {
    spacesListEl.innerHTML = `<div style="color:#64748b; font-size:14px;">No saved spaces yet.</div>`;
    return;
  }

  spacesListEl.innerHTML = spaces.map(s => `
    <div style="border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; background:#fff; position:relative;">
      <button
        onclick="deleteSpace('${escapeHtml(s.id)}')"
        style="position:absolute; top:8px; right:8px; background:none; border:none; cursor:pointer; color:#94a3b8; font-size:16px; padding:4px 8px; border-radius:6px; transition:color 0.15s, background 0.15s;"
        onmouseover="this.style.color='#BF3143'; this.style.background='rgba(191,49,67,0.08)';"
        onmouseout="this.style.color='#94a3b8'; this.style.background='none';"
        title="Delete space"
      >✕</button>
      <div style="font-weight:700; color:#1e293b; margin-bottom:4px; padding-right:28px;">
        ${escapeHtml(s.label || "Untitled space")}
      </div>
      <div style="color:#64748b; font-size:13px;">
        ${escapeHtml((s.appId || "").toUpperCase())} · ${escapeHtml(s.syncCode || "")}
      </div>
    </div>
  `).join("");
}

async function listSpacesForUser(uid) {
  const snap = await db
    .collection("users")
    .doc(uid)
    .collection("spaces")
    .orderBy("createdAt", "desc")
    .get();

  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function addSpace(uid, appId, syncCode, label) {
  const docId = `${appId}_${syncCode}_${Date.now()}`;
  await db.collection("users").doc(uid).collection("spaces").doc(docId).set({
    appId: appId,
    syncCode: syncCode,
    label: label || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// Custom modal confirm
const deleteModal = document.getElementById("deleteModal");
const modalCancel = document.getElementById("modalCancel");
const modalConfirm = document.getElementById("modalConfirm");
let pendingDeleteId = null;

function showDeleteModal(spaceId) {
  pendingDeleteId = spaceId;
  deleteModal.classList.add("active");
}

function hideDeleteModal() {
  deleteModal.classList.remove("active");
  pendingDeleteId = null;
}

modalCancel.addEventListener("click", hideDeleteModal);
deleteModal.addEventListener("click", (e) => {
  if (e.target === deleteModal) hideDeleteModal();
});

modalConfirm.addEventListener("click", async () => {
  if (!pendingDeleteId) return;

  const user = auth.currentUser;
  if (!user) return;

  try {
    modalConfirm.disabled = true;
    await db.collection("users").doc(user.uid).collection("spaces").doc(pendingDeleteId).delete();
    const spaces = await listSpacesForUser(user.uid);
    renderSpaces(spaces);
    hideDeleteModal();
  } catch (e) {
    console.error("Failed to delete space:", e);
    showStatus(e?.message || "Couldn't delete space.", true);
    hideDeleteModal();
  } finally {
    modalConfirm.disabled = false;
  }
});

function deleteSpace(spaceId) {
  showDeleteModal(spaceId);
}

    
    // =========================
    // 4) Sign out
    // =========================
    signOutButton.addEventListener("click", async () => {
      try {
        await auth.signOut();
        showSignInForm();
      } catch (err) {
        console.error(err);
        showStatus(err?.message || "Could not sign out.", true);
      }
    });
  </script>
</body>
</html>
